name: Android preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify core and build APK
        run: gradle --no-daemon :core:verifyCore :app:assembleDebug
      - name: Compare real saved-world fixtures with independent decoder
        run: |
          python -m pip install nbtlib==2.0.4
          python scripts/verify-real-worlds.py
      - name: Verify seed profile metadata
        run: python scripts/verify-seed-profiles.py
      - name: Verify offline manifest
        run: |
          manifest=$(find app/build/intermediates/merged_manifests -name AndroidManifest.xml | head -1)
          test -n "$manifest"
          if grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)|com.android.vending.BILLING' "$manifest"; then
            echo 'Unexpected network or billing permission'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FindDiamonds-offline-preview
          path: app/build/outputs/apk/debug/app-debug.apk
